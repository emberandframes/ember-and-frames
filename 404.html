<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security: CSP + referrer policy delivered via <meta>; GitHub Pages cannot send custom HTTP headers.
       The sha256 source allows only the one inline script below. Edit that script and the hash must be
       recomputed or the browser blocks it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha256-w8r2l9iCS60jvfLwTAVxtsg7pWmq7BCZRqc0ZBOuFjs=' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://www.facebook.com; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- GitHub Pages serves this one document for every missing path at every depth
       (verified: /forms/x and /forms/discovery/x both return it). Over HTTP the base
       keeps every relative URL, including the nav and footer that site.js injects,
       resolving against the site root rather than the failed request's folder.
       Opened off disk there is no site root and "/" would mean the drive root, so
       the base is removed before the parser reaches the first relative URL below. -->
  <base href="/">
  <script>if (location.protocol === "file:") document.querySelector("base").remove();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Ember &amp; Frames</title>
  <meta name="description" content="This page slipped out of frame. Head back to the Ember & Frames studio.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF5EE">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Fallback styling, deliberately placed BEFORE the stylesheet so styles.css
       overrides every rule here whenever it loads. This is the one page that has
       to look right while something is broken, so it does not depend on a file it
       may not be able to reach. Values mirror assets/css/styles.css. -->
  <style>
    :root {
      --off-white: #F5EFE6; --warm: #ECE0CE; --cream-soft: #FBF7F1;
      --olive: #B05C3A; --gold: #C9A84C; --charcoal: #1E1E1E; --muted: #5F6B6E;
      --ember: #C97B3A; --label-ink: #8F4E22;
      --line: rgba(201,168,76,0.18); --line-strong: rgba(201,168,76,0.4);
      --display: 'Cormorant Garamond', 'Cormorant Fallback Garamond', 'Cormorant Fallback Palatino', 'Cormorant Fallback Times', Georgia, serif;
      --body: 'DM Sans', 'DM Sans Fallback Segoe', 'DM Sans Fallback Arial', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --pad-x: clamp(20px, 6vw, 56px); --nav-h: 76px;
    }
    /* styles.css drops both of these below 680px. Without the same breakpoint the
       header renders 14px taller until the stylesheet lands, and everything under
       it jumps up when it does. That was the whole of this page's layout shift. */
    @media (max-width: 680px) {
      :root { --pad-x: 20px; --nav-h: 64px; }
    }
    /* Below 480 this heading takes two lines, and it sits close enough to the
       boundary that it rewraps when the webfont swaps in, dragging the page with
       it. Reserving both lines keeps the box the same size either way. Above 480
       it is one line in both faces, so reserving there would only add a gap. */
    @media (max-width: 479px) {
      body[data-page="404"] .coming h1 { min-height: 2.08em; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Same stand-ins as styles.css, one per installed font because a single
       size-adjust cannot fit Garamond, Palatino and Times at once. */
    @font-face { font-family: 'Cormorant Fallback Garamond'; src: local('Garamond'), local('EB Garamond');
      size-adjust: 97.93%; ascent-override: 94.76%; descent-override: 29.41%; line-gap-override: 0%; }
    @font-face { font-family: 'Cormorant Fallback Palatino'; src: local('Palatino Linotype'), local('Book Antiqua'), local('Palatino');
      size-adjust: 87.82%; ascent-override: 105.67%; descent-override: 32.79%; line-gap-override: 0%; }
    @font-face { font-family: 'Cormorant Fallback Times'; src: local('Times New Roman'), local('Times');
      size-adjust: 94.36%; ascent-override: 98.35%; descent-override: 30.52%; line-gap-override: 0%; }
    @font-face { font-family: 'DM Sans Fallback Segoe'; src: local('Segoe UI');
      size-adjust: 94.71%; ascent-override: 104.74%; descent-override: 32.94%; line-gap-override: 0%; }
    @font-face { font-family: 'DM Sans Fallback Arial'; src: local('Arial'), local('Helvetica');
      size-adjust: 93.43%; ascent-override: 106.18%; descent-override: 33.39%; line-gap-override: 0%; }
    body { background: var(--off-white); color: var(--charcoal); font-family: var(--body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .brand-amp { font-family: var(--display); font-style: italic; font-weight: 500; color: var(--ember); }
    .eyebrow { font-family: var(--body); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--label-ink); font-weight: 400; }
    h2 { font-family: var(--display); font-size: clamp(34px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -0.5px; font-weight: 500; }
    h2 em { font-style: italic; color: var(--olive); }
    .coming h1 { font-family: var(--display); font-size: clamp(34px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -0.5px; font-weight: 500; }
    .coming h1 em { font-style: italic; color: var(--olive); }
    .skip-link { position: absolute; left: -999px; top: 0; z-index: 2000; background: var(--charcoal); color: var(--off-white); padding: 12px 20px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .skip-link:focus { left: 12px; top: 12px; }
    .btn-primary, .btn-ghost { display: inline-block; font-family: var(--body); font-size: 11px; font-weight: 400; letter-spacing: 3.5px; text-transform: uppercase; text-decoration: none; padding: 15px 34px; border-radius: 40px; cursor: pointer; transition: all 0.22s; }
    .btn-primary { background: var(--charcoal); color: var(--off-white); border: 1px solid var(--charcoal); }
    .btn-primary:hover { background: var(--olive); border-color: var(--olive); }
    .btn-ghost { background: transparent; color: var(--charcoal); border: 1px solid var(--charcoal); }
    .btn-ghost:hover { color: var(--olive); border-color: var(--olive); }
    .coming { padding: 92px var(--pad-x); text-align: center; background: var(--cream-soft); }
    .coming-inner { max-width: 720px; margin: 0 auto; }
    .coming .eyebrow { display: block; margin-bottom: 18px; }
    .coming h1, .coming h2 { margin-bottom: 20px; }
    .coming p { font-size: 16px; line-height: 1.8; color: rgba(42,42,37,0.76); font-weight: 300; max-width: 600px; margin: 0 auto 14px; }
    .coming .coming-note { font-family: var(--display); font-style: italic; font-size: 21px; color: var(--charcoal); margin: 26px auto; }
    .coming .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    /* Static chrome. site.js replaces both wrappers outright when it loads, so
       these only ever show when it cannot. Geometry matches .nav and .footer.
       The injected .nav is styled here as well: site.js swaps the element in as
       soon as it runs, which can be before styles.css arrives, and without these
       the header falls back to content height and drags the page down with it. */
    .chrome-nav, .nav { display: flex; align-items: center; padding: 0 var(--pad-x); height: var(--nav-h); background: var(--warm); border-bottom: 1px solid var(--line-strong); }
    [data-region="header"] { min-height: var(--nav-h); }
    .chrome-nav a { font-family: var(--display); font-size: 23px; font-weight: 600; text-decoration: none; }
    .chrome-foot { background: var(--charcoal); padding: 26px var(--pad-x); font-family: var(--display); font-size: 20px; color: var(--off-white); }
  </style>
  <link rel="stylesheet" href="assets/css/styles.css?v=20261005">
</head>

        <h1>This one slipped <em>out of frame</em>.</h1>

        <p class="coming-note">Warm. Intentional. Unforgettable.</p>
        <div class="cta-row">
          <a class="btn-primary" href="index.html">Back to home</a>
          <a class="btn-ghost" href="index.html#work">Browse our work</a>
        </div>
      </div>
    </section>
  </main>

  <div data-region="footer">
    <footer class="chrome-foot">Ember <span class="brand-amp">&amp;</span> Frames</footer>
  </div>

  <script src="assets/js/ef-pixel.js?v=20261005"></script>
  <script src="assets/js/data.js?v=20261010"></script>
  <script src="assets/js/site.js?v=20261005"></script>
</body>
</html>
